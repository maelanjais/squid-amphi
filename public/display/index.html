<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦑 Squid Amphi — Grand Écran</title>
  <meta name="description" content="Squid Amphi — Jeu multijoueur pour amphithéâtre">
  <link rel="stylesheet" href="/css/display.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <div class="lobby-main">
        <div class="logo-section">
          <div class="squid-shapes">
            <div class="shape circle"></div>
            <div class="shape triangle"></div>
            <div class="shape square"></div>
          </div>
          <h1 class="game-title">SQUID<br><span>AMPHI</span></h1>
          <p class="tagline">À LA FIN IL N'EN RESTERA QU'UN.</p>
        </div>
        <div class="join-section">
          <div class="qr-placeholder" id="qr-code">
            <p class="join-url" id="join-url">Chargement...</p>
          </div>
          <p class="join-instruction">Scannez le QR code ou allez sur</p>
          <p class="join-url-big" id="join-url-display"></p>
        </div>
        <button class="btn-start" id="btn-start" style="display:none;">
          COMMENCER LE JEU
        </button>
      </div>
      <div class="lobby-sidebar">
        <div class="players-section">
          <div class="player-count">
            <span id="player-count-num">0</span>
            <span class="player-count-label">JOUEURS</span>
          </div>
          <div class="player-list" id="player-list"></div>
        </div>
        <div class="bot-panel" id="bot-panel">
          <div class="bot-panel-header">
            <span class="bot-icon">🤖</span>
            <span>BOTS</span>
          </div>
          <div class="bot-panel-body">
            <input type="number" id="bot-count" min="1" max="50" value="5" class="bot-input" placeholder="Nb">
            <button class="btn-add-bots" id="btn-add-bots">AJOUTER</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn-reset" id="btn-reset">RÉINITIALISER (R)</button>

  <!-- Explanation Screen -->
  <div id="explanation-screen" class="screen">
    <div class="explanation-container">
      <h2 class="expl-title">PROCHAINE ÉPREUVE</h2>
      <h1 class="game-name-title" id="expl-game-name"></h1>
      <div class="expl-panel">
        <h3>📜 RÈGLES</h3>
        <p class="game-desc" id="expl-game-desc"></p>
        <h3 class="mt">🎮 CONTRÔLES</h3>
        <p class="game-controls" id="expl-game-controls"></p>
      </div>
      <div class="countdown-small" id="expl-timer">10</div>
    </div>
  </div>

  <!-- Countdown Screen -->
  <div id="countdown-screen" class="screen">
    <div class="countdown-container">
      <p class="game-name" id="game-name"></p>
      <div class="countdown-number" id="countdown-number">5</div>
      <p class="game-players" id="game-players"></p>
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>
    <div class="game-hud">
      <div class="hud-left">
        <span class="hud-game-name" id="hud-game-name"></span>
        <span class="hud-game-progress" id="hud-game-progress"></span>
      </div>
      <div class="hud-center" id="hud-center"></div>
      <div class="hud-right">
        <span class="hud-alive" id="hud-alive"></span>
      </div>
    </div>
  </div>

  <!-- Transition: Piggy Bank / Briefcase -->
  <div id="transition-bank-screen" class="screen">
    <div class="bank-container" id="bank-container">
      <h2>CAGNOTTE TOTALE</h2>
      <div class="prize-pool-display" id="prize-pool">0 ₩</div>
      <p class="eliminated-round" id="bank-eliminated">+ 0 joueurs éliminés</p>
      
      <!-- Zone de la malette et des billets -->
      <div class="briefcase-area">
        <div id="money-rain-container"></div>
        <div class="mallette-icon" id="piggy-icon">💼</div>
      </div>
    </div>
  </div>

  <!-- Transition: Dead Memorial Grid -->
  <div id="transition-dead-screen" class="screen">
    <div class="memorial-container">
      <div class="memorial-grid" id="memorial-grid">
        <!-- JS va injecter les tuiles joueurs ici -->
      </div>
    </div>
  </div>

  <!-- Transition: Fall Guys Roulette -->
  <div id="transition-roulette-screen" class="screen">
    <div class="roulette-container">
      <h2>PROCHAINE ÉPREUVE</h2>
      <div class="roulette-window">
        <div class="roulette-reel" id="roulette-reel">
          <!-- JS va injecter les noms de jeux -->
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="screen">
    <div class="gameover-container">
      <div class="crown">👑</div>
      <h1 class="winner-title">VICTOIRE !</h1>
      <div class="winner-name" id="winner-name"></div>
      <div class="confetti-container" id="confetti"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/display/renderer.js"></script>
  <script src="/display/display.js"></script>
</body>
</html>
